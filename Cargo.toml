[package]
name = "dogechain-cli"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for Dogechain.com"
repository = "https://github.com/BlockIo/dogechain-cli"
homepage = "https://dogechain.com"
readme = "README.md"
keywords = ["dogecoin", "blockchain", "cli", "explorer"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
license = "MIT"
authors = ["Block.io, Inc."]

[[bin]]
name = "dogechain"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
sha2 = "0.11"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
